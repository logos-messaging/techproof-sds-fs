[package]
name = "sds-fs-poc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Workspace dependencies (sorted)
chat-proto = { git = "https://github.com/logos-messaging/chat_proto", rev = "e05c21229a18bab655c9aec06409189447d24a6b" }

# External dependencies (sorted)
chacha20poly1305 = "0.10"
ed25519-dalek = "2.2"
hex = "0.4"
hkdf = "0.12"
openmls = { version = "0.8.1", features = ["libcrux-provider"] }
openmls_libcrux_crypto = "0.3.1"
openmls_memory_storage = "0.5.0"
openmls_traits = "0.5.0"
prost = "0.14.1"
rand = "0.9"
sha2 = "0.10"
